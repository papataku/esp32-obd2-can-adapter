[platformio]
; Main integration is code-only; preserve the previously deployed single-client
; m5dial firmware by default. Dual BLE, grouped PIDs, CAN RAW and V2 are
; independently opt-in until a hardware-approved vehicle image is pinned.
; Never assume an existing 8MiB OTA layout has a safe CANLOG partition.
default_envs = m5dial

[env:m5dial_legacy_single]
platform = espressif32@6.12.0
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
extra_scripts = pre:tools/build_identity.py
upload_speed = 1500000
lib_ldf_mode = deep
lib_deps =
    m5stack/M5Dial@1.0.3
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -Wall
    -Wextra
    -fstack-usage

; Explicit opt-in dual-BLE bench base. NOT the default vehicle firmware.
[env:m5dial_dual_ble_bench]
extends = env:m5dial_legacy_single
lib_deps =
    ${env:m5dial_legacy_single.lib_deps}
    h2zero/NimBLE-Arduino@1.4.3
build_flags =
    ${env:m5dial_legacy_single.build_flags}
    -DM5CAN_DUAL_BLE_EXPERIMENTAL=1
    -DM5CAN_RAW_CAN_LOG_RUNTIME=1
    ; Move NimBLE host to core1; CAN/TWAI owner remains pinned core0.
    -DCONFIG_BT_NIMBLE_PINNED_TO_CORE=1
    -DM5CAN_DUAL_BLE_APP_CORE=1

; Only pair with meters built with VEHICLE_M5CAN_MTU247_EXPERIMENTAL.
; Compatibility/stability baseline above remains 20 bytes.
[env:m5dial_dual_ble_mtu_bench]
extends = env:m5dial_dual_ble_bench
build_flags =
    ${env:m5dial_dual_ble_bench.build_flags}
    -DM5CAN_DUAL_NOTIFY_CHUNK_BYTES=244

; USB-only stack regression: exercise TWAI mode changes with physical TX
; compiled out. This profile is never a vehicle diagnostic firmware.
[env:m5dial_dual_ble_canmode_dry_bench]
extends = env:m5dial_dual_ble_bench
build_flags =
    ${env:m5dial_dual_ble_bench.build_flags}
    -DM5CAN_CAN_MODE_DRY_RUN=1

; Experimental dual-peer grouped RPM+speed, as validated on isolated DEMO.
; Requires separate CAN TX policy and physical-vehicle safety qualification.
[env:m5dial_dual_ble_multipid_bench]
extends = env:m5dial_dual_ble_bench
build_flags =
    ${env:m5dial_dual_ble_bench.build_flags}
    -DM5CAN_ADAPTIVE_MULTIPID_EXPERIMENTAL=1

; RELEASE SAFE DEFAULT: retain the original main single-client build.
; The experimental dual-client logger is available ONLY in named bench profiles.
[env:m5dial]
extends = env:m5dial_legacy_single

; Serial/GATT error fixtures only. Physical CAN TX is compiled out.
[env:m5dial_dual_ble_fault_fixture]
extends = env:m5dial_dual_ble_multipid_bench
build_flags =
    ${env:m5dial_dual_ble_multipid_bench.build_flags}
    -DM5CAN_CAN_MODE_DRY_RUN=1
    -DM5CAN_DEMO_FAULT_FIXTURE=1

; Matched 23-byte baseline with identical USB notification counters.
; Keeps 20-byte notifications and avoids any MTU preference change.
[env:m5dial_mtu23_bench]
extends = env:m5dial_legacy_single
build_flags =
    ${env:m5dial_legacy_single.build_flags}
    -DM5CAN_BLE_NOTIFY_DIAG=1

; Opt-in BLE MTU throughput experiment. Stock m5dial stays at 20-byte notify.
[env:m5dial_mtu_bench]
extends = env:m5dial_legacy_single
build_flags =
    ${env:m5dial_legacy_single.build_flags}
    -DM5CAN_BLE_MTU_EXPERIMENTAL=1

; Full integrated code for unattended DEMO soak; CAN TX API compiled out.
[env:m5dial_integrated_soak]
extends = env:m5dial_dual_ble_multipid_bench
build_flags =
    ${env:m5dial_dual_ble_multipid_bench.build_flags}
    -DM5CAN_CAN_MODE_DRY_RUN=1

; Cause-isolation fixture only: preserve the old synchronous producer while
; measuring its real host backlog. CAN TX remains compiled out.
[env:m5dial_memory_diagnostic_baseline]
extends = env:m5dial_integrated_soak
build_flags =
    ${env:m5dial_integrated_soak.build_flags}
    -DM5CAN_SYNC_NOTIFY_DIAGNOSTIC=1

; Read-only build/evaluation target for the PROPOSED 8MiB log layout.
; DO NOT upload: moving the OTA app1 partition requires a verified full-flash
; backup, otadata inspection and a controlled migration. Existing EvidenceStore
; spiffs at 0x670000/0x180000 remains unchanged in this proposal.
; Default [env:m5dial] continues to use the deployed partition table.
[env:m5dial_flash_layout_eval]
extends = env:m5dial_dual_ble_multipid_bench
board_build.partitions = partitions/m5can_8mb_dual_ota_canlog_proposed.csv

; Single-factory-app, no-OTA 8MiB proposal (experimental BUILD-ONLY).
; DO NOT UPLOAD as a firmware update on an existing OTA-configured M5Dial.
; Existing NVS/evidence offsets remain fixed but app locations and otadata
; boot selection need a separately approved full-flash migration.
[env:m5dial_single_app_layout_eval]
extends = env:m5dial_dual_ble_multipid_bench
board_build.partitions = partitions/m5can_8mb_single_app_canlog_proposed.csv

; Paired with meter env:t4s3_m5can_mtu247_log_bench.
; Only exercises MTU247/244-byte notifications; old READ remains 48 bytes.
; No BLE-stream data producer or flash partition migration is enabled.
[env:m5dial_dual_ble_multipid_mtu_bench]
extends = env:m5dial_dual_ble_multipid_bench
build_flags =
    ${env:m5dial_dual_ble_multipid_bench.build_flags}
    -DM5CAN_DUAL_NOTIFY_CHUNK_BYTES=244

; Compile-only V2 owner mailbox stage. Does not register a GATT channel,
; enable a sender, move any flash partitions, or alter normal CAN traffic.
; NEVER flash this profile as a working V2 exporter.
[env:m5dial_v2_owner_compile]
extends = env:m5dial_dual_ble_multipid_bench
build_flags =
    ${env:m5dial_dual_ble_multipid_bench.build_flags}
    -DM5CAN_LOG_STREAM_V2_EXPERIMENTAL=1

; Dedicated authenticated V2 lab image. Runtime GATT service and CAN-idle
; journal owner are compiled in (unlike the default m5dial profile).
; Deliberately retains the EXISTING partition layout: no OTA relocation,
; automatic CANLOG creation/erase, flash reclaim, or migration.
; Without a pre-verified, separately migrated and protected 'canlog' region,
; the RAW journal remains unavailable and transfers fail closed.
; Requires an explicit operator identity via environment variable
; M5CAN_LOG_V2_ALLOWED_PEER_ID48=0xAABBCCDDEEFF (use the REAL approved identity).
; Never auto-upload or deploy to a vehicle without hardware validation.
[env:m5dial_v2_authenticated_lab]
extends = env:m5dial_dual_ble_multipid_bench
extra_scripts =
    pre:tools/build_identity.py
    pre:tools/platformio_v2_lab.py
build_flags =
    ${env:m5dial_dual_ble_multipid_bench.build_flags}
    -DM5CAN_LOG_STREAM_V2_EXPERIMENTAL=1
    -DM5CAN_V2_AUTHENTICATED_LAB=1

; Fresh-install V2 lab image — USER APPROVED ERASING EXISTING FLASH.
; 8MiB M5Dial / ESP32-S3 only. SINGLE factory app 2MiB, 4.375MiB CANLOG,
; 1.5MiB SPIFFS, coredump; OTA is intentionally removed.
; This environment itself DOES NOT erase or upload. Before any actual upload:
; inspect flash size; explicitly run a whole-chip erase on the chosen USB
; device (old NVS, OTA apps, SPIFFS evidence and journals are all lost).
; M5CAN_V2_FRESH_FLASH_ACK=ERASE_ALL_8MB_OLD_DATA_REQUIRED and an authorized
; bonded BLE peer identity are mandatory at build time. Keep default env intact.
[env:m5dial_v2_fresh_flash_lab]
extends = env:m5dial_v2_authenticated_lab
board_build.partitions = partitions/m5can_8mb_single_app_canlog_proposed.csv
extra_scripts =
    pre:tools/build_identity.py
    pre:tools/platformio_v2_lab.py
    pre:tools/platformio_v2_fresh_gate.py
build_flags =
    ${env:m5dial_v2_authenticated_lab.build_flags}
    -DM5CAN_V2_FRESH_FLASH_LAB=1

; Issue #129 A/B only: same approved identity, encrypted V2 GATT, 8MiB
; CANLOG partition and explicit erase consent as the standard fresh lab.
; A single CAN block is capped at 16*216=3456 bytes incl. 32-byte header.
; A smaller payload trades ~4.5% journal capacity for fewer SD readback ACKs.
; NOT the default or a proven faster on-air firmware until matched RF A/B.
[env:m5dial_v2_fresh_flash_window16_lab]
extends = env:m5dial_v2_fresh_flash_lab
build_flags =
    ${env:m5dial_v2_fresh_flash_lab.build_flags}
    -DM5CAN_V2_SINGLE_WINDOW_CODEC=1

; Paired-receiver lab only: both meters must explicitly support MTU247 RX.
; Same already-migrated single-app layout as the V2 baseline; never erase
; or rewrite partitions merely to switch this application profile.
[env:m5dial_v2_fresh_flash_mtu247_lab]
extends = env:m5dial_v2_fresh_flash_lab
build_flags =
    ${env:m5dial_v2_fresh_flash_lab.build_flags}
    -DM5CAN_DUAL_NOTIFY_CHUNK_BYTES=244

; Opt-in preparation for a device ALREADY running the exact single-factory-app
; partition layout. This is an app-only vehicle trial candidate, NOT a vehicle
; qualification and NOT permission to erase, upload the partition table or
; reuse on an OTA-layout M5Dial. V1 CAN journal + ordinary dual ELM/multi-PID;
; MTU-aware ASCII chunks <= each peer's negotiated ATT MTU. No V2 GATT/bulk.
; Vehicle boot forces DEMO OFF in RAM without rewriting saved NVS settings.
; A build-only gate requires the private, pre-approved peer identity for
; provenance (NOT a V1 runtime allowlist) and the installed partition SHA.
[env:m5dial_existing_singleapp_vehicle_trial]
extends = env:m5dial_dual_ble_multipid_mtu_bench
board_build.partitions = partitions/m5can_8mb_single_app_canlog_proposed.csv
extra_scripts =
    pre:tools/build_identity.py
    pre:tools/platformio_vehicle_trial_gate.py
build_flags =
    ${env:m5dial_dual_ble_multipid_mtu_bench.build_flags}
    -DM5CAN_VEHICLE_TRIAL=1

; Default m5dial is the existing request-driven TX-capable ELM327 adapter.
; It is NOT a CAN-disabled fallback; rollback ONLY from verified original backup.
; V2-1 below excludes TWAI init/TX (linked-symbol check in CI).
; Only V2-2 envs enable Signal-V2 TX; legacy ELM TX remains separate.
; Signal protocol only, no TWAI init/TX; preserves default release env.
; NEVER use PlatformIO upload here: application-only explicit write after
; full backup + installed partition comparison (see runbook).
[env:m5dial_signal_v2_can_disabled_lab]
extends = env:m5dial_dual_ble_bench
build_unflags = -DM5CAN_RAW_CAN_LOG_RUNTIME=1
extra_scripts =
    pre:tools/build_identity.py
    pre:tools/signal_v2_bond_guard.py
build_flags =
    ${env:m5dial_dual_ble_bench.build_flags}
    -DM5CAN_SIGNAL_V2_EXPERIMENTAL=1
    -DM5CAN_CAN_TX_HARD_DISABLED=1
    -DCONFIG_BT_NIMBLE_MAX_BONDS=4

; V2-2: dedicated 29bit physical Mode01; USB arming is mandatory.
; Default and V2-1 CAN-disabled lab remain unchanged.
[env:m5dial_signal_v2_can_29bit_5hz_lab]
extends = env:m5dial_signal_v2_can_disabled_lab
build_unflags =
    -DM5CAN_CAN_TX_HARD_DISABLED=1
build_flags =
    ${env:m5dial_dual_ble_bench.build_flags}
    -DM5CAN_SIGNAL_V2_EXPERIMENTAL=1
    -DM5CAN_SIGNAL_V2_CAN_EXPERIMENTAL=1
    -DM5CAN_ECU_SELECTION_EXPERIMENTAL=1
    -DM5CAN_ADAPTIVE_MULTIPID_EXPERIMENTAL=1
    ; N1: owner-approved RP8 physical discovery candidate {18DAF101} only.
    -DM5CAN_SIGNAL_V2_RP8_PROFILE=1
    -DCONFIG_BT_NIMBLE_MAX_BONDS=4

[env:m5dial_signal_v2_can_29bit_10hz_lab]
extends = env:m5dial_signal_v2_can_29bit_5hz_lab
build_flags =
    ${env:m5dial_signal_v2_can_29bit_5hz_lab.build_flags}
    -DM5CAN_SIGNAL_V2_10HZ_LAB=1

; Dedicated USB-only ambient receiver. No BLE/ELM/query/lease application linked.
; GPIO39 is a temporary disconnected-header sink during driver installation;
; before twai_start the TX signal is disconnected from ALL GPIO output routes.
[env:m5dial_signal_v2_can_29bit_passive]
extends = env:m5dial_legacy_single
; App-only on the owner's already-migrated 8MiB factory layout. Never migrate.
board_build.partitions = partitions/m5can_8mb_single_app_canlog_proposed.csv
lib_deps =
    m5stack/M5GFX@0.2.35
build_src_filter = -<*> +<passive_rx.cpp>
build_flags =
    ${env:m5dial_legacy_single.build_flags}
    -DM5CAN_PASSIVE_TX_ISOLATED=1
    -include include/passive_build_guard.h
