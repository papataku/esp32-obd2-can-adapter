[platformio]
default_envs = m5dial

[env:m5dial]
platform = espressif32@6.12.0
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
lib_ldf_mode = deep
lib_deps =
    m5stack/M5Dial@1.0.3
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -Wall
    -Wextra
