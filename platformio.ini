[platformio]
; Default M5CAN firmware includes dual BLE, retained evidence journal and the
; bounded physical RPM+speed 01 0C 0D grouped request with safe fallback.
; The m5dial environment itself uses the all-on profile; the legacy single-connection/individual-PID build is named m5dial_legacy_single for regression only.
; RPM session capture/export is NOT implemented yet (PR #32 work in progress).
default_envs = m5dial

[env:m5dial_legacy_single]
platform = espressif32@6.12.0
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
extra_scripts = pre:tools/build_identity.py
upload_speed = 1500000
lib_ldf_mode = deep
lib_deps =
    m5stack/M5Dial@1.0.3
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -Wall
    -Wextra
    -fstack-usage

; Dual BLE base. The default build selects the grouped profile below.
[env:m5dial_dual_ble_bench]
extends = env:m5dial_legacy_single
lib_deps =
    ${env:m5dial_legacy_single.lib_deps}
    h2zero/NimBLE-Arduino@1.4.3
build_flags =
    ${env:m5dial_legacy_single.build_flags}
    -DM5CAN_DUAL_BLE_EXPERIMENTAL=1
    -DM5CAN_RAW_CAN_LOG_RUNTIME=1
    ; Move NimBLE host to core1; CAN/TWAI owner remains pinned core0.
    -DCONFIG_BT_NIMBLE_PINNED_TO_CORE=1
    -DM5CAN_DUAL_BLE_APP_CORE=1

; Only pair with meters built with VEHICLE_M5CAN_MTU247_EXPERIMENTAL.
; Compatibility/stability baseline above remains 20 bytes.
[env:m5dial_dual_ble_mtu_bench]
extends = env:m5dial_dual_ble_bench
build_flags =
    ${env:m5dial_dual_ble_bench.build_flags}
    -DM5CAN_DUAL_NOTIFY_CHUNK_BYTES=244

; USB-only stack regression: exercise TWAI mode changes with physical TX
; compiled out. This profile is never a vehicle diagnostic firmware.
[env:m5dial_dual_ble_canmode_dry_bench]
extends = env:m5dial_dual_ble_bench
build_flags =
    ${env:m5dial_dual_ble_bench.build_flags}
    -DM5CAN_CAN_MODE_DRY_RUN=1

; DEFAULT firmware: existing read-only grouped RPM+speed CAN with fallback.
; Physical simulated-ECU acceptance is still required before vehicle use.
[env:m5dial_dual_ble_multipid_bench]
extends = env:m5dial_dual_ble_bench
build_flags =
    ${env:m5dial_dual_ble_bench.build_flags}
    -DM5CAN_ADAPTIVE_MULTIPID_EXPERIMENTAL=1

; Normal m5dial target: all required features are compiled by default.
; The legacy single-client configuration exists solely for regression.
[env:m5dial]
extends = env:m5dial_dual_ble_multipid_bench

; Serial/GATT error fixtures only. Physical CAN TX is compiled out.
[env:m5dial_dual_ble_fault_fixture]
extends = env:m5dial_dual_ble_multipid_bench
build_flags =
    ${env:m5dial_dual_ble_multipid_bench.build_flags}
    -DM5CAN_CAN_MODE_DRY_RUN=1
    -DM5CAN_DEMO_FAULT_FIXTURE=1

; Matched 23-byte baseline with identical USB notification counters.
; Keeps 20-byte notifications and avoids any MTU preference change.
[env:m5dial_mtu23_bench]
extends = env:m5dial_legacy_single
build_flags =
    ${env:m5dial_legacy_single.build_flags}
    -DM5CAN_BLE_NOTIFY_DIAG=1

; Opt-in BLE MTU throughput experiment. Stock m5dial stays at 20-byte notify.
[env:m5dial_mtu_bench]
extends = env:m5dial_legacy_single
build_flags =
    ${env:m5dial_legacy_single.build_flags}
    -DM5CAN_BLE_MTU_EXPERIMENTAL=1

; Full integrated code for unattended DEMO soak; CAN TX API compiled out.
[env:m5dial_integrated_soak]
extends = env:m5dial_dual_ble_multipid_bench
build_flags =
    ${env:m5dial_dual_ble_multipid_bench.build_flags}
    -DM5CAN_CAN_MODE_DRY_RUN=1

; Cause-isolation fixture only: preserve the old synchronous producer while
; measuring its real host backlog. CAN TX remains compiled out.
[env:m5dial_memory_diagnostic_baseline]
extends = env:m5dial_integrated_soak
build_flags =
    ${env:m5dial_integrated_soak.build_flags}
    -DM5CAN_SYNC_NOTIFY_DIAGNOSTIC=1

; Read-only build/evaluation target for the PROPOSED 8MiB log layout.
; DO NOT upload: moving the OTA app1 partition requires a verified full-flash
; backup, otadata inspection and a controlled migration. Existing EvidenceStore
; spiffs at 0x670000/0x180000 remains unchanged in this proposal.
; Default [env:m5dial] continues to use the deployed partition table.
[env:m5dial_flash_layout_eval]
extends = env:m5dial
board_build.partitions = partitions/m5can_8mb_dual_ota_canlog_proposed.csv

; Single-factory-app, no-OTA 8MiB proposal (experimental BUILD-ONLY).
; DO NOT UPLOAD as a firmware update on an existing OTA-configured M5Dial.
; Existing NVS/evidence offsets remain fixed but app locations and otadata
; boot selection need a separately approved full-flash migration.
[env:m5dial_single_app_layout_eval]
extends = env:m5dial
board_build.partitions = partitions/m5can_8mb_single_app_canlog_proposed.csv
