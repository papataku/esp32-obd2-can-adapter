[platformio]
build_dir = .pio/build-ring
default_envs = smartring_signal_v2_client_lab

[env:smartring_signal_v2_client_lab]
; Same board, Arduino 3.1.1, flash/PSRAM and default_16MB layout as the
; read-only TacoTacoMeter SmartRing reference. Upload app only after backup.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
platform_packages =
    platformio/framework-arduinoespressif32@https://github.com/espressif/arduino-esp32.git#3.1.1
    platformio/framework-arduinoespressif32-libs@https://dl.espressif.com/AE/esp-arduino-libs/esp32-3.1.1-h.zip
framework = arduino
board = viewe_smartring
monitor_speed = 115200
lib_deps = h2zero/NimBLE-Arduino@1.4.3
extra_scripts =
    pre:tools/build_identity.py
    pre:tools/signal_v2_bond_guard.py
build_src_filter = -<*> +<signal_v2_codec.cpp> +<signal_v2_client.cpp>
build_flags =
    -DM5CAN_SIGNAL_V2_CLIENT_LAB=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -fstack-usage
    -DCONFIG_BT_NIMBLE_MAX_BONDS=4
