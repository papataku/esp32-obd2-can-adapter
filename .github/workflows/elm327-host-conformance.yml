name: ELM327 host-only conformance (no CAN hardware)
on:
  pull_request:
    paths:
      - "tools/elm327_sim/**"
      - "tests/elm327_conformance/**"
      - ".github/workflows/elm327-host-conformance.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-host:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    name: Host Python ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
      - name: Install pinned test dependencies
        run: python -m pip install pytest==8.3.5 pyserial==3.5
      - name: Confirm interpreter version and installed dependencies
        run: python -c "import sys,pytest,serial; print(sys.version); print('pytest',pytest.__version__,'pyserial',serial.VERSION)"
      - name: Validate host-only ECU, ISO-TP, ELM and CDC
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/elm327_conformance
      - name: Prove CLI loads without hardware
        run: python -m tools.elm327_sim --help
