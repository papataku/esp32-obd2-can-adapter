name: Signal V2 CAN-disabled and 29bit V2-2 lab
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protocol-and-firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install platformio
      - run: ./tests/run_all.sh
      - run: pio pkg install -e m5dial_signal_v2_can_disabled_lab
      - run: pio run -e m5dial_signal_v2_can_disabled_lab
      - name: Prove V2-1 linked TWAI TX and initialization exclusion
        run: python tools/check_signal_v2_elf.py .pio/build/m5dial_signal_v2_can_disabled_lab/firmware.elf --nm ~/.platformio/packages/toolchain-xtensa-esp32s3/bin/xtensa-esp32s3-elf-nm | tee v21-linked-symbol-evidence.txt
      - uses: actions/upload-artifact@v4
        with:
          name: v21-linked-symbol-evidence
          path: v21-linked-symbol-evidence.txt
          if-no-files-found: error
      - run: pio run -c platformio_smartring_v2_lab.ini
      - run: python tools/check_signal_v2_elf.py .pio/build-ring/smartring_signal_v2_client_lab/firmware.elf --nm ~/.platformio/packages/toolchain-xtensa-esp-elf/bin/xtensa-esp32s3-elf-nm

  v2-2-can-29bit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install platformio
      - run: ./tests/run_all.sh
      - run: pio run -e m5dial_signal_v2_can_29bit_5hz_lab
      - run: pio run -e m5dial_signal_v2_can_29bit_10hz_lab
      - run: pio run -e m5dial_signal_v2_can_29bit_serial_hil
      - name: Prove serial HIL image links no physical TWAI driver
        run: python tools/check_signal_v2_elf.py .pio/build/m5dial_signal_v2_can_29bit_serial_hil/firmware.elf --hil --nm ~/.platformio/packages/toolchain-xtensa-esp32s3/bin/xtensa-esp32s3-elf-nm

  v2-2-virtual-ecu-timeseries:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: papataku/esp32-obd2-can-adapter
          ref: 0aacdd16fbcc4d41c1bc3da2636402df8eb721f8
          path: elm-sim
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: PYTHONPATH=elm-sim python -m pytest -q elm-sim/tests/elm327_conformance/test_timeseries.py
      - run: python tests/test_signal_v2_virtual_bridge.py elm-sim
